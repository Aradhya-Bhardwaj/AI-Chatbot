      console.log('Closing camera modal...');
      const modal = document.getElementById('cameraModal');
      const video = document.getElementById('videoFeed');
      if (videoStream) {
        console.log('Stopping video stream...');
        videoStream.getTracks().forEach(track => track.stop());
        videoStream = null;
      }
      video.srcObject = null;
      modal.style.display = 'none';
      console.log('Modal closed');
    }

    // Capture image from video
    async function captureImage() {
      console.log('Capturing image...');
      const video = document.getElementById('videoFeed');
      if (!video.videoWidth || !video.videoHeight) {
        console.error('Video feed not ready');
        addMessage(translations[currentLanguage].imageError, 'bot-message');
        closeCameraModal();
        return;
      }

      const canvas = document.createElement('canvas');
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      canvas.getContext('2d').drawImage(video, 0, 0);

      // Display captured image in chat
      const imageDataUrl = canvas.toDataURL('image/jpeg');
      console.log('Image captured, displaying in chat...');
      const img = `<img src="${imageDataUrl}" class="image-message" alt="Captured image">`;
      addMessage(img, 'user-message');

      // Show loading message
      loadingMessageEl = addMessage(translations[currentLanguage].analyzing, 'bot-message');

      // Send captured image to Gemini API
      try {
        console.log('Sending captured image to API...');
        const base64Image = imageDataUrl.split(',')[1];
        const response = await fetchGeminiImageResponse(base64Image, 'image/jpeg');
        if (loadingMessageEl) loadingMessageEl.remove();
        addMessage(response, 'bot-message');
        console.log('API response received and displayed');
      } catch (err) {
        console.error('Image analysis error:', err);
        if (loadingMessageEl) loadingMessageEl.remove();
        addMessage(translations[currentLanguage].imageError, 'bot-message');
      }

      // Close modal
      closeCameraModal();
    }

    // Convert file to base64
    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result.split(',')[1]);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    async function sendMessage() {
      const input = document.getElementById("userInput");
      const message = input.value.trim();
      if (!message) return;

      addMessage(message, "user-message");
      input.value = "";
      showBottomInput();

      loadingMessageEl = addMessage(translations[currentLanguage].typing, 'bot-message');

      const response = await fetchGeminiResponse(message);

      if (loadingMessageEl) loadingMessageEl.remove();
      addMessage(response, "bot-message");
    }

    async function sendMessageFromBottom() {
      const input = document.getElementById("userInputBottom");
      const message = input.value.trim();
      if (!message) return;

      addMessage(message, "user-message");
      input.value = "";

      loadingMessageEl = addMessage(translations[currentLanguage].typing, 'bot-message');

      const response = await fetchGeminiResponse(message);

      if (loadingMessageEl) loadingMessageEl.remove();
      addMessage(response, "bot-message");
    }

    function showBottomInput() {
      if (!chatStarted) {
        document.getElementById("centerInput").style.display = "none";
        document.getElementById("bottomInput").style.display = "block";
        chatStarted = true;
      }
    }

    async function fetchGeminiResponse(text) {
      const langMap = {
        en: 'English',
        es: 'Spanish',
        fr: 'French',
        de: 'German',
        hi: 'Hindi'
      };
      const prompt = `I am Jennie, a Virtual Makeup Try-On Assistant here to assist with makeup, skincare, and haircuts. Please answer this clearly and professionally in ${langMap[currentLanguage]}:\n\n"${text}"`;

      try {
        const res = await fetch(`${API_URL}?key=${API_KEY}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            contents: [{ parts: [{ text: prompt }] }]
          })
        });

        const data = await res.json();
        const rawText = data.candidates[0].content.parts[0].text;
        return formatBotResponse(rawText);
      } catch (err) {
        console.error(err);
        return translations[currentLanguage].imageError;
      }
    }

    async function fetchGeminiImageResponse(base64Image, mimeType) {
      const langMap = {
        en: 'English',
        es: 'Spanish',
        fr: 'French',
        de: 'German',
        hi: 'Hindi'
      };
      const prompt = `I am Jennie, a Virtual Makeup Try-On Assistant. Analyze this image to detect the user's skin tone, face shape (e.g., oval, round, square), and hair type (e.g., straight, wavy, curly). Based on the analysis, provide personalized suggestions in ${langMap[currentLanguage]} for:
      - **Makeup**: Suggest specific products (e.g., lipstick shades, eyeshadow colors) that complement the detected skin tone.
      - **Outfit**: Recommend outfit styles (e.g., colors, clothing types) that suit the skin tone.
      - **Haircut**: Suggest haircut styles (e.g., bob, pixie, layered) that flatter the detected face shape and work well with the hair type.
      If detection of any feature (skin tone, face shape, or hair type) is not possible, provide general suggestions in ${langMap[currentLanguage]} and explain why.`;

      try {
        const res = await fetch(`${API_URL}?key=${API_KEY}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            contents: [{
              parts: [
                { text: prompt },
                {
                  inlineData: {
                    mimeType: mimeType,
                    data: base64Image
                  }
                }
              ]
            }]
          })
        });

        const data = await res.json();
        const rawText = data.candidates[0].content.parts[0].text;

        // Fallback if Gemini cannot analyze features
        if (rawText.includes('cannot analyze') || rawText.includes('unable to detect')) {
          return formatBotResponse(translations[currentLanguage].imageFallback);
        }

        return formatBotResponse(rawText);
      } catch (err) {
        console.error(err);
        return formatBotResponse(translations[currentLanguage].imageFallback);
      }
    }

    function formatBotResponse(text) {
      const lines = text.split("\n").filter(line => line.trim() !== "");
      let formatted = "";
      let list = [];

      lines.forEach(line => {
        const cleanLine = line.replace(/\*\*(.*?)\*\*/g, "$1").replace(/<[^>]*>/g, "");

        if (/^[-•*]\s+/.test(cleanLine)) {
          list.push(cleanLine.replace(/^[-•*]\s+/, ""));
        } else {
          if (list.length) {
            formatted += "<ul>" + list.map(item => `<li>${item}</li>`).join("") + "</ul>";
            list = [];
          }
          formatted += `<p>${cleanLine}</p>`;
        }
      });

      if (list.length) {
        formatted += "<ul>" + list.map(item => `<li>${item}</li>`).join("") + "</ul>";
      }

      return formatted;
    }

    function addMessage(content, type) {
      const chatBody = document.getElementById("chatBody");
      const messageEl = document.createElement("div");
      messageEl.className = `message ${type}`;
      messageEl.innerHTML = content;
      chatBody.appendChild(messageEl);
      chatBody.scrollTop = chatBody.scrollHeight;
      return messageEl;
    }

    document.addEventListener("keypress", function (e) {
      if (e.key === "Enter" && !chatStarted) sendMessage();
      else if (e.key === "Enter" && chatStarted) sendMessageFromBottom();
    });
  </script>
